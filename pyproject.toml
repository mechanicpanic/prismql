[project]
name = "prismql"
version = "0.1.0"
description = "Pattern Recognition in Sequential Messages Query Language - A DSL for chat corpora analysis"
authors = [{name = "PrismQL Contributors", email = "prismql@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["query-language", "chat-analysis", "nlp", "search", "dsl", "antlr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
opensearch = ["opensearch-py>=2.0.0"]
elasticsearch = ["elasticsearch>=8.0.0"]
nlp = ["spacy>=3.0.0"]
all = ["prismql[opensearch,elasticsearch,nlp]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.261",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/prismql/prismql"
Documentation = "https://prismql.readthedocs.io"
Repository = "https://github.com/prismql/prismql"
Issues = "https://github.com/prismql/prismql/issues"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prismql = ["grammar/*.g4"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "C90", "UP", "ANN", "S", "A", "C4", "RET", "SIM", "ARG"]
ignore = ["ANN101", "ANN102"]
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true