[project]
name = "prismql"
version = "0.1.0"
description = "Pattern Recognition in Sequential Messages Query Language - A DSL for chat corpora analysis"
authors = [{name = "Anna Smirnova", email = "anna.smirnova@unil.ch"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["query-language", "chat-analysis", "nlp", "search", "dsl", "antlr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "typing-extensions>=4.0.0",
    # The operator layer is a Polars plan over an Arrow table (P3): every
    # sequence/window query needs both, so they are core, not an extra.
    "polars>=1.44,<2",
    "pyarrow>=15",
    # contains() stems by default (Snowball, per-corpus language); memory and
    # tantivy share one algorithm so one query means one set on both.
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
tantivy = ["tantivy>=0.24"]
nlp = [
    "spacy>=3.0.0",
]
semantic = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
# `prismql ingest --embed`: the same model stack, named for what it does.
ingest = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
# Kept as empty aliases for one release: both are core since P3.
arrow = []
plan = []
highlighting = [
    "pygments>=2.0.0",
]
repl = [
    "prompt_toolkit>=3.0.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
mcp = [
    "mcp>=2.0",
]
all = ["prismql[nlp,semantic,ingest,arrow,plan,repl,highlighting,server,mcp]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "hatchling>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mechanicpanic/prismql"
Repository = "https://github.com/mechanicpanic/prismql"
Issues = "https://github.com/mechanicpanic/prismql/issues"

[project.scripts]
prismql = "prismql.repl:main"
prismql-server = "prismql.server.app:main"
prismql-mcp = "prismql.server.mcp:main"

[project.entry-points."pygments.lexers"]
prismql = "prismql.highlighting:PrismQLLexer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prismql"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 88
target-version = "py312"
# "*.md": ruff >= 0.16 formats code blocks inside markdown; docs stay as authored.
extend-exclude = ["src/prismql/grammar/generated", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "S101",   # Use of assert detected
]

[tool.ruff.lint.per-file-ignores]
"src/prismql/backends/base.py" = ["ARG002"]  # interface defaults that raise ignore their arguments
"tests/*" = ["S101", "ANN201", "ANN001", "B017", "E712"]
"tests/test_highlighting.py" = ["E402"]  # pytest.importorskip() must be called before imports
"examples/**/*" = ["ANN201", "ANN001", "E501", "W291", "C901", "B007"]
"scripts/*" = ["S602", "ANN201", "ANN001"]
"src/prismql/grammar/generated/*" = ["ALL"]
"src/prismql/visitors/*" = ["N802", "C901", "E501"]  # ANTLR patterns, complexity, long lines
"src/prismql/engine.py" = ["N802", "N803", "ARG002", "E501"]  # ANTLR interface requirements, long deprecation msg
"src/prismql/backends/factory.py" = ["C901"]  # Complexity - future refactor candidate
"src/prismql/backends/spacy.py" = ["S110", "C901"]  # Intentional except pass, complexity
"src/prismql/processors/window.py" = ["C901", "ANN001", "ANN202", "SIM102"]  # Complexity, helper-closure annotations
"src/prismql/highlighting/pygments_lexer.py" = ["E501"]  # Long regex strings
"tests/test_quantifier_fix.py" = ["E501"]  # Long query strings
"tests/test_sequential_chaining.py" = ["E501"]  # Long query strings
"src/prismql/server/mcp.py" = ["S310"]  # urllib to a user-configured local server
"src/prismql/server/app.py" = ["C901"]  # app factory holds the route closures
"tests/test_server_config.py" = ["S104"]  # "0.0.0.0" literal in a config-parsing test
"tests/test_server_app.py" = ["E501"]  # Long query strings
"tests/test_field_condition.py" = ["E501"]  # Long fixture lines
"src/prismql/processors/temporal.py" = ["C901", "ARG004"]  # Complexity & unused args
"src/prismql/processors/variables.py" = ["E501", "ARG002"]  # Line length & unused args
"src/prismql/aggregators/aggregator.py" = ["C901"]  # Complexity - future refactor
"examples/pattern_variables_example.py" = ["C901"]  # Example complexity acceptable
"examples/named_pattern_groups_example.py" = ["C901", "B007"]  # Example complexity and unused loop vars
"examples/negative_patterns_example.py" = ["C901"]  # Example complexity acceptable
"examples/quantifiers_example.py" = ["C901"]  # Example complexity acceptable
"examples/custom_features_example.py" = ["C901"]  # Example complexity acceptable
"src/prismql/types.py" = ["E501", "ANN204"]  # Long docstring examples, __init__ annotation
"src/prismql/utils/index_builders.py" = ["C901", "E501", "SIM114"]  # Complexity acceptable for utility, long docstrings
"tests/test_named_pattern_groups.py" = ["E501"]  # Long query strings
"tests/test_negative_patterns.py" = ["E501"]  # Long query strings and comments
"tests/test_quantifiers.py" = ["E501", "S110"]  # Long query strings, intentional except pass
"tests/test_index_builder.py" = ["ANN202"]  # Test helper functions don't need return annotations
"src/prismql/validator.py" = ["E501", "ARG002", "ANN204", "SIM102"]  # Long strings, unused tree param, __init__ annotation, nested if
"examples/llm_query_validation.py" = ["E501", "ARG001", "RET505"]  # Long strings, unused arg in mock, unnecessary elif
"tests/test_validator.py" = ["F841"]  # Unused variable in test
"experiments/*.py" = ["E501", "ANN001", "ANN201", "ANN204", "E402", "A003", "C401"]  # Experiments: long lines, annotations, imports after path, id shadowing, comprehension
"src/prismql/repl.py" = ["C901"]  # REPL complexity acceptable
"demo/*.py" = ["ANN201", "E501", "C901", "S311", "SIM118"]  # Demo code: annotations, line length, complexity, random usage, style
"tests/test_board_js.py" = ["S603"]  # node binary resolved via shutil.which, args are a fixed local test path

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "antlr4.*",
    "prismql.grammar.generated.*",
    "psycopg2.*",
    "pygments.*",
    "prismql_rust",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "prismql.highlighting.*"
ignore_missing_imports = true

# Optional / conditional imports of the server extra. fastapi/pydantic/
# uvicorn are fully type-checked when installed (local dev); the
# pre-commit mypy env doesn't install them, so missing imports are
# tolerated there.
[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "uvicorn",
    "tantivy",
    "tantivy.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "snowballstemmer",
    "numpy",
    "numpy.*",
    "polars",
    "polars.*",
    "prompt_toolkit",
    "prompt_toolkit.*",
]
ignore_missing_imports = true

# The mcp SDK and click >= 8.4 require Python >= 3.10 (match statements);
# our mypy runs at python_version 3.9, so don't follow imports into them.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "click", "click.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Pre-existing type debt in performance-critical processors.
# These modules type-annotate the public interface but use Union[int, str]
# polymorphism internally that mypy can't narrow; cleaning up requires a
# dedicated pass and is tracked separately.
[[tool.mypy.overrides]]
module = [
    "prismql.processors.window",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/prismql"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/grammar/generated/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "twine>=6.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.27",
    # the semantic index's numpy path is tested against the pure-Python one;
    # without it here that test skips silently (graph @aleph/prismql, node #26)
    "numpy>=1.24",
]
[tool.uv]
default-groups = ["dev"]
# The Rust kernels (sibling ../prismql-rust, retiring after P3) are NOT a
# declared dependency: a path source would make every fresh clone fail to
# resolve. Owner installs them by hand — see AGENTS.md "Rebuild Rust backend".
