[project]
name = "prismql"
version = "0.1.0"
description = "Pattern Recognition in Sequential Messages Query Language - A DSL for chat corpora analysis"
authors = [{name = "Anna Smirnova", email = "anna.smirnova@unil.ch"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["query-language", "chat-analysis", "nlp", "search", "dsl", "antlr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
opensearch = ["opensearch-py>=2.0.0"]
elasticsearch = ["elasticsearch>=8.0.0"]
nlp = [
    "spacy>=3.0.0",
]
highlighting = [
    "pygments>=2.0.0",
]
repl = [
    "prompt_toolkit>=3.0.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tomli>=2.0; python_version<'3.11'",
]
mcp = [
    "mcp>=1.0; python_version>='3.10'",
]
demo = [
    "streamlit>=1.28.0",
    "pandas>=1.5.0",
    "pygments>=2.0.0",
]
all = ["prismql[opensearch,elasticsearch,nlp,repl,highlighting,demo,server,mcp]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "hatchling>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mechanicpanic/prismql"
Repository = "https://github.com/mechanicpanic/prismql"
Issues = "https://github.com/mechanicpanic/prismql/issues"

[project.scripts]
prismql = "prismql.repl:main"
prismql-server = "prismql.server.app:main"
prismql-mcp = "prismql.server.mcp:main"

[project.entry-points."pygments.lexers"]
prismql = "prismql.highlighting:PrismQLLexer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prismql"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["src/prismql/grammar/generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "S101",   # Use of assert detected
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "ANN001", "B017", "E712"]
"tests/test_highlighting.py" = ["E402"]  # pytest.importorskip() must be called before imports
"examples/**/*" = ["ANN201", "ANN001", "E501", "W291", "C901", "B007"]
"scripts/*" = ["S602", "ANN201", "ANN001"]
"src/prismql/grammar/generated/*" = ["ALL"]
"src/prismql/visitors/*" = ["N802", "C901", "E501"]  # ANTLR patterns, complexity, long lines
"src/prismql/engine.py" = ["N802", "N803", "ARG002", "E501"]  # ANTLR interface requirements, long deprecation msg
"src/prismql/backends/factory.py" = ["C901"]  # Complexity - future refactor candidate
"src/prismql/backends/spacy.py" = ["S110", "C901"]  # Intentional except pass, complexity
"src/prismql/processors/window.py" = ["C901", "ANN001", "ANN202", "SIM102"]  # Complexity, helper-closure annotations
"src/prismql/processors/histogram_window.py" = ["C901", "ANN001", "ANN202", "ANN204", "B007", "E501"]  # Performance-critical helpers
"src/prismql/highlighting/pygments_lexer.py" = ["E501"]  # Long regex strings
"tests/test_quantifier_fix.py" = ["E501"]  # Long query strings
"tests/test_sequential_chaining.py" = ["E501"]  # Long query strings
"src/prismql/server/mcp.py" = ["S310"]  # urllib to a user-configured local server
"src/prismql/server/app.py" = ["C901"]  # app factory holds the route closures
"tests/test_server_config.py" = ["S104"]  # "0.0.0.0" literal in a config-parsing test
"tests/test_server_app.py" = ["E501"]  # Long query strings
"tests/test_field_condition.py" = ["E501"]  # Long fixture lines
"src/prismql/processors/temporal.py" = ["C901", "ARG004"]  # Complexity & unused args
"src/prismql/processors/variables.py" = ["E501", "ARG002"]  # Line length & unused args
"src/prismql/aggregators/aggregator.py" = ["C901"]  # Complexity - future refactor
"examples/pattern_variables_example.py" = ["C901"]  # Example complexity acceptable
"examples/named_pattern_groups_example.py" = ["C901", "B007"]  # Example complexity and unused loop vars
"examples/negative_patterns_example.py" = ["C901"]  # Example complexity acceptable
"examples/quantifiers_example.py" = ["C901"]  # Example complexity acceptable
"examples/custom_features_example.py" = ["C901"]  # Example complexity acceptable
"src/prismql/types.py" = ["E501", "ANN204"]  # Long docstring examples, __init__ annotation
"src/prismql/utils/index_builders.py" = ["C901", "E501", "SIM114"]  # Complexity acceptable for utility, long docstrings
"tests/test_named_pattern_groups.py" = ["E501"]  # Long query strings
"tests/test_negative_patterns.py" = ["E501"]  # Long query strings and comments
"tests/test_quantifiers.py" = ["E501", "S110"]  # Long query strings, intentional except pass
"tests/test_index_builder.py" = ["ANN202"]  # Test helper functions don't need return annotations
"src/prismql/backends/postgres.py" = ["E501", "S608", "SIM108"]  # Long SQL strings, false positive SQL injection warnings, ternary style choice
"src/prismql/backends/duckdb.py" = ["E501", "S608", "SIM102", "S110"]  # Long SQL strings, false positive warnings, nested if style, try-except-pass for optional FTS
"examples/postgres_annotation_platform.py" = ["E501", "S106", "A001", "E402"]  # Long strings, password in example, shadowing id builtin, imports after header
"examples/duckdb_research_interface.py" = ["E501", "A001", "E402", "S108"]  # Long strings, shadowing id builtin, imports after header, /tmp usage in examples
"src/prismql/validator.py" = ["E501", "ARG002", "ANN204", "SIM102"]  # Long strings, unused tree param, __init__ annotation, nested if
"examples/llm_query_validation.py" = ["E501", "ARG001", "RET505"]  # Long strings, unused arg in mock, unnecessary elif
"tests/test_validator.py" = ["F841"]  # Unused variable in test
"experiments/*.py" = ["E501", "ANN001", "ANN201", "ANN204", "E402", "A003", "C401"]  # Experiments: long lines, annotations, imports after path, id shadowing, comprehension
"src/prismql/repl.py" = ["C901"]  # REPL complexity acceptable
"demo/*.py" = ["ANN201", "E501", "C901", "S311", "SIM118"]  # Demo code: annotations, line length, complexity, random usage, style

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "antlr4.*",
    "prismql.grammar.generated.*",
    "psycopg2.*",
    "duckdb.*",
    "pygments.*",
    "prismql_rust",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "prismql.highlighting.*"
ignore_missing_imports = true

# Optional / conditional imports of the server extra. fastapi/pydantic/
# uvicorn are fully type-checked when installed (local dev); the
# pre-commit mypy env doesn't install them, so missing imports are
# tolerated there.
[[tool.mypy.overrides]]
module = [
    "tomli",
    "pyarrow",
    "pyarrow.*",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "uvicorn",
]
ignore_missing_imports = true

# The mcp SDK requires Python >= 3.10 (match statements); our mypy runs at
# python_version 3.9, so don't follow imports into it at all.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Pre-existing type debt in performance-critical processors.
# These modules type-annotate the public interface but use Union[int, str]
# polymorphism internally that mypy can't narrow; cleaning up requires a
# dedicated pass and is tracked separately.
[[tool.mypy.overrides]]
module = [
    "prismql.processors.window",
    "prismql.processors.histogram_window",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/prismql"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/grammar/generated/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "twine>=6.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.27",
]
# Local-dev acceleration: uv builds the sibling Rust crate (release wheel
# via maturin) and keeps it across syncs — previously `uv sync` silently
# pruned a maturin-develop install. Default group locally; CI machines
# without the sibling checkout run `uv sync --no-group rust` (see
# .github/workflows). Force a rebuild after Rust changes with:
#   uv sync --reinstall-package prismql-rust
rust = [
    "prismql-rust",
]

[tool.uv]
default-groups = ["dev", "rust"]

[tool.uv.sources]
prismql-rust = { path = "../prismql-rust" }
