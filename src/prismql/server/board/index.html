<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrismQL board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="board.css" />
  <link rel="stylesheet" href="board-views.css" />
  <link rel="stylesheet" href="board-full.css" />
  <link rel="stylesheet" href="board-corpus.css" />
</head>
<body>
  <div id="app" class="app t-dark">
    <header class="topbar" id="topbar">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 21 19H3z"></path>
          <path d="M12 3v16M7.5 11h9" opacity=".55"></path>
        </svg>
        PrismQL <span>board</span>
      </div>
      <button class="live off" type="button" id="live-toggle"
        aria-label="Resume the live journal" title="Resume the live journal">
        <i></i><b id="live-word">off</b><span id="live-sep" aria-hidden="true" hidden>&middot;</span><span
          id="live-note" aria-hidden="true"></span>
      </button>
      <label class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input type="search" id="search" placeholder="Search queries, sources, results"
          aria-label="Search the journal" />
      </label>
      <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
        <button class="iconbtn" type="button" id="theme-toggle" aria-label="Switch to light theme"
          title="Switch to light theme">
          <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4">
            </path>
          </svg>
          <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
          </svg>
        </button>
        <button class="primary" type="button" id="new-query">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          New query
        </button>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="Filters">
      <div>
        <h3>Time</h3>
        <div class="seg" id="rail-range" role="group" aria-label="Time range"></div>
      </div>
      <div>
        <h3>Kind</h3>
        <div id="rail-kind"></div>
      </div>
      <div>
        <h3>Source</h3>
        <div id="rail-source"></div>
      </div>
      <div>
        <h3>Corpus</h3>
        <div id="rail-corpus"></div>
      </div>
      <div>
        <h3>Status</h3>
        <div id="rail-status"></div>
      </div>
      <div id="rail-reset"></div>
      <div class="rail-corpora">
        <h3>Corpora</h3>
        <div id="rail-corpora"></div>
      </div>
    </nav>

    <main class="journal" id="journal" aria-label="Journal">
      <div class="jhead">
        <h2>Journal</h2>
        <span class="count" id="journal-count"></span>
        <div id="journal-errpill"></div>
        <span style="margin-left: auto; font-size: 12px; color: var(--faint);">newest first</span>
      </div>
      <div class="chips" id="journal-chips" hidden></div>
      <div class="list" id="journal-list" tabindex="0"
        aria-label="Requests. Arrow keys move, Enter opens the output full screen"></div>
    </main>

    <aside class="insp" id="inspector" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button class="tab on" id="tab-details" type="button" role="tab" aria-selected="true">Request</button>
        <button class="tab" id="tab-editor" type="button" role="tab" aria-selected="false">Editor</button>
        <button class="tab" id="tab-corpus" type="button" role="tab" aria-selected="false">Corpus</button>
      </div>
      <div class="pane" id="inspector-pane"></div>
    </aside>

    <section id="full" class="fv" tabindex="-1" aria-label="Request output" hidden></section>
  </div>

  <script src="prismql-lexer.js"></script>
  <script src="format.js"></script>
  <script src="lexjson.js"></script>
  <script src="api.js"></script>
  <script src="board-util.js"></script>
  <script src="editor-logic.js"></script>
  <script src="inspector-format.js"></script>
  <script src="inspector-corpora.js"></script>
  <script src="inspector-page-logic.js"></script>
  <script src="inspector-ui.js"></script>
  <script src="inspector-fetch.js"></script>
  <script src="inspector-groups.js"></script>
  <script src="inspector-hits.js"></script>
  <script src="inspector-rows.js"></script>
  <script src="inspector-detail.js"></script>
  <script src="inspector-output.js"></script>
  <script src="rail.js"></script>
  <script src="corpus-logic.js"></script>
  <script src="corpus-schemas.js"></script>
  <script src="rail-corpora.js"></script>
  <script src="inspector-corpus.js"></script>
  <script src="journal-list.js"></script>
  <script src="journal.js"></script>
  <script src="inspector.js"></script>
  <script src="editor-actions.js"></script>
  <script src="editor-build.js"></script>
  <script src="editor.js"></script>
  <script src="fullview-logic.js"></script>
  <script src="fullview-rows.js"></script>
  <script src="fullview-load.js"></script>
  <script src="fullview-rows-context.js"></script>
  <script src="fullview-data.js"></script>
  <script src="fullview-header.js"></script>
  <script src="fullview-fcenter.js"></script>
  <script src="fullview-summary.js"></script>
  <script src="fullview-timeline.js"></script>
  <script src="fullview-table.js"></script>
  <script src="fullview-focus.js"></script>
  <script src="fullview-body.js"></script>
  <script src="fullview.js"></script>
  <script src="board-stream.js"></script>
  <script src="board.js"></script>
</body>
</html>
